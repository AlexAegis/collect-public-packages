# managed-by-autotool
packages:
  - apps/*
  - examples/*
  - fixtures/*
  - libs/*
  - packages/*

# Prevent recursive `pnpm install` from being triggered by lifecycle/run scripts
# (e.g. `vite build` inside `postinstall`), which would re-enter `postinstall`.
verifyDepsBeforeRun: false

# pnpm 10+ requires explicit approval for build/lifecycle scripts of dependencies.
# Map of package name -> boolean. `true` = run the package's install scripts.
allowBuilds:
  esbuild: true
  svelte-preprocess: true

# pnpm 11+ defaults `minimumReleaseAge` to 1440 (24h), which delays freshly
# published packages and makes pnpm auto-write a `minimumReleaseAgeExclude` list
# on install. Set to 0 to opt out of that supply-chain delay entirely.
minimumReleaseAge: 0

# vitepress 1.x pins vite 5, but vitest 4 needs vite 6+ (for `vite/module-runner`).
# Force vitest's transitive vite to the workspace's vite 8 so the two don't
# collapse onto vite 5. vitepress keeps its own vite 5.
overrides:
  vite: '^8.1.0'
